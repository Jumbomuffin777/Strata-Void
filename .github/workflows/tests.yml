# CPU-only checks: the server, Task-Parallel Requests and setup's SYCL card table, against fake engines.
# No GPU, no model download. The SYCL engine itself is built and tested on real Intel hardware (docs/BENCHMARKS.md).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Task-parallel requests
        run: python -m unittest serve.test_task_parallel serve.test_task_parallel_v2 -v
      - name: Batch slots in the server
        run: python -m unittest serve.test_parallel -v
      - name: SYCL setup card table
        run: python tools/test_setup_sycl.py
      - name: Example configs parse
        run: |
          python - <<'PY'
          import glob, json
          for f in sorted(glob.glob("examples/*.json")):
              c = json.load(open(f))
              assert c["exe"] and "--max-context" in c["args"], f
              print("ok", f)
          PY
